<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Opening Silicon Mode…</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/auth/bounce.css">
</head>
<body>
<!-- Sign-in hand-off to the Mac app. Static on purpose: no analytics, no third-party code (tokens pass through this page). -->
<main>
<img class="mark" src="/icon.svg" alt="" width="56" height="56">
<h1 id="title">Opening Silicon Mode</h1>
<p id="status">You&#8217;re signed in. Taking you back to your Mac&#8230;</p>
<div class="spinner" aria-hidden="true"></div>
<a id="open" class="open" href="ai.tos.mode://auth/callback">Open Silicon Mode</a>
<p id="hint" class="hint">Nothing happened? Click the button, or open Silicon Mode from the menu bar.</p>
</main>
<script src="/auth/bounce.js"></script>
</body>
</html>
